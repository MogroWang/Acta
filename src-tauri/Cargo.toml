[package]
name = "acta"
version = "3.4.0"
description = "Acta · 行记"
authors = ["MogroWang Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "acta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
url = "2"

# 图标适配：macOS 26+ Dock 位图解码/裁切/缩放（与 tauri 内置 image 同源）；
# Windows 任务栏图标按系统 DPI 尺寸重采样同样依赖。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target."cfg(windows)".dependencies]
# 任务栏（ICON_BIG）图标设置：Tauri 的 set_icon 只写标题栏小图标。
# 钉选到任务栏后的图标同步还需 IShellLinkW（改写钉选快捷方式的图标位置）。
# 版本必须与 tauri crate 使用的 windows crate 一致，否则 hwnd 类型对不上。
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSObject"] }
