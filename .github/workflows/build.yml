name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build portable exe
        run: npm run windows:portable
      - name: Collect portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter *.exe |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No portable exe found in release output." }
          Copy-Item $exe.FullName "dist/Acta-${{ steps.ver.outputs.version }}-windows-x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Acta-${{ steps.ver.outputs.version }}-windows-x64-portable
          path: dist/Acta-*-windows-x64-portable.exe
          if-no-files-found: error

  macos-dmg:
    name: macOS arm64 dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build app bundle
        # 只产出 .app；dmg 由下一步自行打包，以便放入「启动修复」脚本与说明
        run: npm run macos:build:app
      - name: Strip quarantine attribute from app bundle
        shell: bash
        run: |
          # 未签名/未公证的 app 带着 quarantine 扩展属性时，Gatekeeper 会直接
          # 报“已损坏”。构建产物里任何环节（工具链、缓存恢复）意外写入的
          # quarantine 都在这里清掉，保证进入 dmg 的 .app 不带该属性。
          app_path=$(ls -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app 2>/dev/null | head -n 1)
          if [ -z "$app_path" ]; then echo "No app bundle found." >&2; exit 1; fi
          sudo xattr -r -d com.apple.quarantine "$app_path" 2>/dev/null || true
          echo "Cleared com.apple.quarantine on: $app_path"
      - name: Package dmg with repair script
        shell: bash
        run: |
          # 应用下载后仍会被用户侧 Gatekeeper 打上 quarantine 而提示“已损坏”，
          # 因此在 dmg 内一并放入修复脚本（sudo xattr -r -d com.apple.quarantine）
          # 和开源说明，用户双击脚本、输入密码即可修复启动。
          bash scripts/dmg/package-dmg.sh "${{ steps.ver.outputs.version }}"
          sudo xattr -r -d com.apple.quarantine "dist/Acta-${{ steps.ver.outputs.version }}-macos-arm64.dmg" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Acta-${{ steps.ver.outputs.version }}-macos-arm64
          path: dist/Acta-*-macos-arm64.dmg
          if-no-files-found: error

  android-apk:
    name: Android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install dependencies
        run: npm ci
      - name: Sync web assets
        run: npm run android:sync
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > acta-release.keystore
            printf 'storeFile=acta-release.keystore\nstorePassword=%s\nkeyAlias=acta-release\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets ANDROID_RELEASE_KEYSTORE_B64 / ANDROID_RELEASE_KEYSTORE_PASSWORD are not set. Falling back to the runner's ephemeral debug key — this APK will NOT upgrade-install over existing releases."
          fi
      - name: Build release apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Collect apk
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Acta-${{ steps.ver.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Acta-${{ steps.ver.outputs.version }}-android-apk
          path: dist/Acta-*-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-portable, macos-dmg, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
